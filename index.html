	<meta name="theme-color" content="#3f9ae6" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#1c5289" media="(prefers-color-scheme: dark)" />

	<style>
		:root {
			color-scheme: light dark;

			--photo-size: 220px;

			--bg:         #ffffff;
			--fg:         #333333;
			--muted:      #666666;
			--icon:       #8a8a8a;
			--icon-hover: #333333;
			--band-top:   #3f9ae6;
			--band-bot:   #62b1ef;
			--ring:       #1f6fc4;
			--photo-edge: #ffffff;
			--photo-glow: rgba(0, 0, 0, .3);
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg:         #12151a;
				--fg:         #e8ebf0;
				--muted:      #9aa4b2;
				--icon:       #7e8896;
				--icon-hover: #e8ebf0;
				--band-top:   #1c5289;
				--band-bot:   #2b6ba8;
				--ring:       #7cb4ff;
				--photo-edge: #12151a;
				--photo-glow: rgba(0, 0, 0, .6);
			}
		}

		* { box-sizing: border-box; }

		html { -webkit-text-size-adjust: 100%; }

		body {
			margin: 0;
			background: var(--bg);
			color: var(--fg);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
			             "Helvetica Neue", Arial, sans-serif;
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
		}

		/* Saturated band ending on a hard edge against --bg, mirroring the
		   original wallpaper-over-white split. Replaces the parallax image. */
		.band {
			height: 52vh;
			min-height: 260px;
			max-height: 460px;
			background: linear-gradient(160deg, var(--band-top), var(--band-bot));
		}

		.card {
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
			padding: 0 24px 64px;
			margin-top: calc(var(--photo-size) / -2);
		}

		.photo {
			width: var(--photo-size);
			height: var(--photo-size);
			border-radius: 50%;
			object-fit: cover;
			border: 3px solid var(--photo-edge);
			background: var(--photo-edge);
			box-shadow: 0 1px 3px var(--photo-glow);
		}

		.name,
		.role {
			max-width: 34rem;
			overflow-wrap: break-word;
		}

		/* Light, tightly-tracked display type with a bold name — the original
		   header's defining treatment. */
		.name {
			margin: 30px 0 0;
			font-size: clamp(2rem, 5.6vw, 3.125rem);
			font-weight: 200;
			letter-spacing: -.04em;
			line-height: 1.1;
		}

		.name strong { font-weight: 700; }

		.role {
			margin: 10px 0 0;
			font-size: 1.125rem;
			font-weight: 400;
			line-height: 1.5;
			color: var(--muted);
		}

		.role strong {
			font-weight: 600;
			color: var(--fg);
		}

		.links {
			display: flex;
			gap: 10px;
			margin-top: 32px;
		}

		.links a {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 44px;
			height: 44px;
			border-radius: 50%;
			color: var(--icon);
			transition: color .15s ease, transform .15s ease;
		}

		.links a:hover,
		.links a:focus-visible {
			color: var(--icon-hover);
			transform: translateY(-2px);
		}

		.links a:focus-visible {
			outline: 2px solid var(--ring);
			outline-offset: 2px;
		}

		.links svg {
			width: 21px;
			height: 21px;
			fill: currentColor;
		}

		@media (max-width: 560px) {
			:root { --photo-size: 150px; }
			.band { min-height: 200px; }
			.role { font-size: 1rem; }
		}

		/* Landscape phones and short windows: the width query can't reach them
		   (a 844x390 phone is 844 wide), so shrink on height instead. */
		@media (max-height: 560px) {
			:root { --photo-size: 120px; }
			.band { height: 34vh; min-height: 110px; }
			.name { margin-top: 20px; font-size: clamp(1.75rem, 4vw, 2.25rem); }
			.links { margin-top: 20px; }
			.card { padding-bottom: 32px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.links a { transition: none; }
			.links a:hover,
			.links a:focus-visible { transform: none; }
		}
	</style>
</head>
